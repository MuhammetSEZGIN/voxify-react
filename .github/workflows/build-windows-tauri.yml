name: Build Windows (Tauri)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Write .env
        shell: bash
        run: |
          cat <<EOF > .env
          VITE_BASE_URL=${{ secrets.VITE_BASE_URL }}
          VITE_HUB_URL=${{ secrets.VITE_HUB_URL }}
          VITE_PRESENCE_HUB_URL=${{ secrets.VITE_PRESENCE_HUB_URL }}
          VITE_LIVEKIT_URL=${{ secrets.VITE_LIVEKIT_URL }}
          VITE_VOICE_SERVER_URL=${{ secrets.VITE_VOICE_SERVER_URL }}
          VITE_TENOR_API_KEY=${{ secrets.VITE_TENOR_API_KEY }}
          VITE_TENOR_CLIENT_KEY=${{ secrets.VITE_TENOR_CLIENT_KEY }}
          VITE_IMGBB_KEY=${{ secrets.VITE_IMGBB_KEY }}
          VITE_VERSION_LINK=${{ secrets.VITE_VERSION_LINK }}
          VITE_MOCKING=false
          EOF

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxify-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.sig
          if-no-files-found: warn
